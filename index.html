<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#121a2a">
  <title>今晚去超商</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Geist", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
      background: #121a2a;
      color: #fff5e4;
      --muted: #bbc5d6;
      --line: #34425a;
    }
    *, *::before, *::after { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; min-height: 100dvh; }
    .shell {
      width: min(100% - 64px, 1320px);
      margin: 0 auto;
      padding: 26px 0 20px;
    }
    header, footer { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    header { margin-bottom: 18px; }
    .brand { display: flex; align-items: center; gap: 13px; }
    .mark {
      width: 43px; aspect-ratio: 1; display: grid; place-items: center;
      border-radius: 12px; background: #f9cd83; color: #263044;
      font: 750 22px/1 "PingFang TC", system-ui, sans-serif;
    }
    h1 { margin: 0; font-size: clamp(21px, 3vw, 30px); line-height: 1.13; letter-spacing: .025em; }
    .location {
      display: flex; align-items: center; gap: 9px;
      border: 1px solid var(--line); border-radius: 24px;
      padding: 8px 14px; color: #e1e9f7; font-size: 13px; white-space: nowrap;
    }
    .location::before {
      content: ""; display: block; width: 7px; height: 7px; border-radius: 50%;
      background: #ffd498; box-shadow: 0 0 12px #ffbd7370;
    }
    .stage {
      position: relative; isolation: isolate; overflow: hidden;
      border-radius: 22px; border: 1px solid #35445e;
      width: 100%; height: clamp(380px, calc(100dvh - 165px), 800px);
      background: radial-gradient(ellipse at 53% 48%, #3a4d70 0%, #25344e 53%, #192438 100%);
    }
    .stage[data-scene="counter"] {
      display: grid; grid-template-columns: minmax(0, 1fr) minmax(310px, 36%);
      background: radial-gradient(ellipse at 50% 44%, #f0d6a5 0%, #cfad7c 57%, #917659 100%);
    }
    .world { position: relative; width: 100%; height: 100%; min-width: 0; min-height: 0; }
    .stage canvas { display: block; width: 100%; height: 100%; touch-action: manipulation; }
    button {
      font: inherit; cursor: pointer; border: 0; border-radius: 10px;
      font-weight: 700; touch-action: manipulation;
    }
    button:focus-visible { outline: 3px solid #fbcb84; outline-offset: 4px; }
    .entry {
      position: absolute; z-index: 1; left: 50%; top: 42%; transform: translate(-50%, -100%);
      min-height: 42px; padding: 0 15px;
      background: #ffe1a8; color: #242c3a; box-shadow: 0 5px 17px #151c35a6;
      white-space: nowrap; font-size: 13px;
    }
    .entry::after {
      content: ""; position: absolute; left: 50%; top: calc(100% - 4px);
      width: 8px; height: 8px; transform: translateX(-50%) rotate(45deg);
      background: inherit; border-radius: 1px;
    }
    .entry:hover { background: #fff0d1; }
    .return {
      position: absolute; top: 18px; left: 18px; z-index: 1; padding: 0 15px;
      min-height: 44px; background: #252e3e; color: #fff5e4; font-size: 14px;
    }
    .return:hover { background: #3d485a; }
    .checkout {
      min-width: 0; min-height: 0; overflow: auto; color-scheme: light;
      display: flex; flex-direction: column; justify-content: safe center;
      padding: clamp(20px, 3vw, 42px);
      border-left: 1px solid #e7d7bb; background: #fff7e9; color: #203c37;
    }
    .checkout-top {
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; margin-bottom: 12px;
    }
    .checkout h2 { margin: 0; font-size: 16px; line-height: 1.4; }
    .checkout h2:focus { outline: none; }
    .hint {
      min-height: 36px; padding: 4px 10px; background: #f0e6d3;
      color: #334a43; font-size: 13px; white-space: nowrap;
    }
    .hint:hover, .hint[aria-pressed="true"] { background: #dfebd9; }
    .clerk-line {
      margin-bottom: 14px; padding: 12px 14px;
      border-left: 3px solid #558e7d; background: #f2eddf; border-radius: 3px 9px 9px 3px;
    }
    .clerk-top {
      display: flex; align-items: center; justify-content: space-between;
      gap: 10px; margin-bottom: 4px;
    }
    .speaker { color: #4e6259; font-size: 12px; }
    .listen {
      min-height: 44px; padding: 6px 11px; white-space: nowrap;
      background: #e6eddf; color: #294e41; font-size: 13px;
    }
    .listen:hover, .listen[data-playing] { background: #cce1ce; }
    .listen::before { content: "▶"; margin-right: 5px; font-size: 10px; }
    .clerk-top .listen { min-height: 32px; }
    .audio-status, .reply-note { margin: 6px 0 0; color: #4e6259; font-size: 12px; }
    .reply-note { margin: 0 0 7px; }
    .japanese {
      font-family: "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif;
      line-height: 1.55;
    }
    .question { margin: 0; font-size: clamp(20px, 2.25vw, 29px); font-weight: 700; }
    .translation { display: block; margin: 4px 0 0; font-size: 13px; font-weight: 500; }
    .options { display: grid; gap: 8px; }
    .reply-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px; }
    .reply {
      min-height: 46px; padding: 10px 13px; text-align: left; color: #244638;
      border: 1px solid #a9bcad; background: #fffdf7; font-size: 15px;
    }
    .reply:hover { border-color: #568775; background: #eaf1e4; }
    .checkout button:focus-visible { outline: 3px solid #377768; outline-offset: 2px; }
    .reply.primary { background: #255b4d; border-color: #255b4d; color: #fffaf0; }
    .reply.primary:hover { background: #184538; }
    .reply:disabled, .listen:disabled { opacity: .65; cursor: default; }
    .receipt { margin: 0 0 12px; padding: 10px 14px; background: #fffdf8; border: 1px solid #e0d7c5; border-radius: 8px; }
    .receipt-row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 4px 0; font-size: 14px; }
    .receipt-row dd { margin: 0; text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .receipt-row dt small { margin-left: 7px; color: #53655b; }
    .receipt-total { margin-top: 4px; padding-top: 8px; border-top: 1px dashed #b4bbad; font-weight: 750; }
    .transition {
      position: absolute; inset: 0; z-index: 3; pointer-events: none;
      background: #151e30; opacity: 0; transition: opacity 160ms ease;
    }
    .transition.active { opacity: 1; pointer-events: auto; }
    .message {
      position: absolute; inset: 0; z-index: 4; display: grid; place-content: center;
      text-align: center; padding: 24px; background: #192438;
    }
    footer { min-height: 56px; padding: 14px 1px 0; color: var(--muted); font-size: 13px; }
    .keys { display: flex; align-items: center; flex-wrap: wrap; gap: 7px; }
    kbd {
      padding: 3px 8px; border-radius: 6px; border: 1px solid #45556e;
      box-shadow: 0 1px 0 #45556e; color: #f8efdf;
      font: 600 11px/1.5 ui-monospace, monospace;
    }
    .touch-controls { display: none; }
    @media (max-width: 820px) {
      .stage[data-scene="counter"] { grid-template-columns: minmax(0, 1fr); height: auto; }
      .stage[data-scene="counter"] .world { height: clamp(205px, 34dvh, 340px); }
      .checkout { border-left: 0; border-top: 1px solid #e7d7bb; }
    }
    @media (pointer: coarse), (max-width: 650px) {
      .shell { width: calc(100% - 28px); padding-top: 15px; }
      header { margin-bottom: 13px; }
      .mark { width: 36px; font-size: 18px; border-radius: 9px; }
      .location { padding: 7px 10px; font-size: 12px; }
      .stage { height: clamp(340px, calc(100dvh - 172px), 720px); border-radius: 16px; }
      .keys { display: none; }
      .touch-controls { display: flex; gap: 6px; }
      .touch-controls button {
        color: #fff5e4; background: #25334a; border: 1px solid #45556e;
        width: 40px; height: 42px; font-size: 19px; touch-action: none;
      }
      .touch-controls button.is-held { background: #4c6181; }
      .return { top: 11px; left: 11px; }
    }
    @media (max-width: 370px) { footer { gap: 8px; font-size: 11px; } }
    @media (prefers-reduced-motion: reduce) { .transition { transition: none; } }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div class="brand">
        <span class="mark" aria-hidden="true">夜</span>
        <h1>今晚去超商</h1>
      </div>
      <div id="location" class="location" role="status">街道</div>
    </header>

    <section id="stage" class="stage" data-scene="street" aria-label="3D 場景">
      <div id="world" class="world">
        <button id="enter" class="entry" type="button" hidden>進入超商 ↗</button>
        <button id="leave" class="return" type="button" hidden>← 回到街道</button>
      </div>
      <section id="checkout" class="checkout" aria-labelledby="checkout-title" hidden>
        <div class="checkout-top">
          <h2 id="checkout-title" tabindex="-1">便當加熱</h2>
          <button id="hint" class="hint" type="button" aria-pressed="false">顯示中文</button>
        </div>
        <div class="clerk-line">
          <div class="clerk-top">
            <span class="speaker">店員</span>
            <button id="replay" class="listen" type="button" aria-label="播放店員台詞">播放</button>
          </div>
          <div aria-live="polite">
            <p id="question" class="question japanese" lang="ja"></p>
            <p id="translation" class="translation" hidden></p>
          </div>
          <p id="audio-status" class="audio-status" role="status" hidden></p>
        </div>
        <audio id="dialogue-audio" preload="none" hidden></audio>
        <dl id="receipt" class="receipt" hidden></dl>
        <p id="reply-note" class="reply-note" hidden>可先試聽跟念，點日文句子送出。</p>
        <div id="options" class="options" role="group" aria-label="回覆與操作"></div>
      </section>
      <div id="transition" class="transition" aria-hidden="true"></div>
      <audio id="door-chime" preload="auto" hidden></audio>
      <div id="message" class="message" role="status">正在載入 3D 場景…</div>
    </section>

    <footer id="street-footer">
      <div id="street-help" class="keys"><kbd>W A S D</kbd><span>或</span><kbd>↑ ← ↓ →</kbd><span>移動</span></div>
      <div id="touch-controls" class="touch-controls" aria-label="移動角色" hidden>
        <button type="button" data-direction="left" aria-label="向左走">←</button>
        <button type="button" data-direction="forward" aria-label="向前走">↑</button>
        <button type="button" data-direction="back" aria-label="向後走">↓</button>
        <button type="button" data-direction="right" aria-label="向右走">→</button>
      </div>
      <span id="instruction">走到門口，或直接點門進去。</span>
    </footer>
  </main>

  <!-- Game source. The bundled Three.js dependency is below this script. -->
  <script>
    window.addEventListener("DOMContentLoaded", () => {
      try {
        startGame(THREE);
      } catch (error) {
        document.querySelector("#message").textContent =
          "無法啟動 3D 場景。請用支援 WebGL 2 的瀏覽器重新開啟。";
        console.error(error);
      }
    });

    function createCheckout(panel, counterModel) {
      const title = panel.querySelector("#checkout-title");
      const hint = panel.querySelector("#hint");
      const question = panel.querySelector("#question");
      const translation = panel.querySelector("#translation");
      const replay = panel.querySelector("#replay");
      const player = panel.querySelector("#dialogue-audio");
      const audioStatus = panel.querySelector("#audio-status");
      const replyNote = panel.querySelector("#reply-note");
      const options = panel.querySelector("#options");
      const receipt = panel.querySelector("#receipt");

      const prices = { bento: 530, tea: 150, bag: 3 };
      const yen = (amount) => `¥${amount}`;
      let showChinese = false;
      let step;
      let heated;
      let bagged;
      let clerkClip;
      let activePlayback = null;

      function stopSpeech() {
        activePlayback?.button.removeAttribute("data-playing");
        activePlayback = null;
        player.pause();
      }

      async function playSpeech(clip, button) {
        stopSpeech();
        audioStatus.hidden = true;
        const request = { button };
        activePlayback = request;
        try {
          const source = checkoutClips[clip];
          if (player.getAttribute("src") === source) {
            player.currentTime = 0;
          } else {
            player.src = source;
          }
          await player.play();
          if (activePlayback !== request) return;
          button.dataset.playing = "";
          if (button === replay) {
            replay.textContent = "重聽";
            replay.setAttribute("aria-label", "重聽店員台詞");
          }
        } catch (error) {
          if (activePlayback !== request) return;
          stopSpeech();
          audioStatus.textContent = button === replay && error.name === "NotAllowedError"
            ? "點播放按鈕聽店員說話。"
            : "語音暫時無法播放，請再試一次。";
          audioStatus.hidden = false;
        }
      }

      function advance(nextStep) {
        step = nextStep;
        render();
        playSpeech(clerkClip, replay);
      }

      function chooseHeat(choice) {
        heated = choice;
        advance("bag");
      }

      function chooseBag(choice) {
        bagged = choice;
        advance("cash");
      }

      function reset() {
        heated = false;
        bagged = false;
        advance("heat");
      }

      function pay(event) {
        stopSpeech();
        audioStatus.hidden = true;
        replay.disabled = true;
        const button = event.currentTarget;
        button.disabled = true;
        button.textContent = "已付款";
        title.textContent = "正在列印收據…";
        title.focus({ preventScroll: true });
        counterModel.print(() => advance("receipt"));
      }

      function renderReceipt(total) {
        const lines = [
          ["便當", yen(prices.bento), heated ? "已加熱" : "未加熱"],
          ["茶", yen(prices.tea)],
          ["購物袋", bagged ? yen(prices.bag) : "未加購"],
          ["現金實付", yen(total)]
        ];
        receipt.replaceChildren(...lines.map(([label, value, detail], index) => {
          const row = document.createElement("div");
          row.className = "receipt-row";
          row.classList.toggle("receipt-total", index === lines.length - 1);
          const name = document.createElement("dt");
          name.textContent = label;
          if (detail) {
            const note = document.createElement("small");
            note.textContent = detail;
            name.append(note);
          }
          const amount = document.createElement("dd");
          amount.textContent = value;
          row.append(name, amount);
          return row;
        }));
      }

      function updateHint() {
        hint.textContent = showChinese ? "隱藏中文" : "顯示中文";
        hint.setAttribute("aria-pressed", String(showChinese));
        for (const meaning of panel.querySelectorAll(".translation")) meaning.hidden = !showChinese;
      }

      function render() {
        const total = prices.bento + prices.tea + (bagged ? prices.bag : 0);
        const complete = step === "receipt";
        const scenes = {
          heat: {
            title: "便當加熱",
            ja: "こちら、温めますか？",
            zh: "這個要加熱嗎？",
            clip: "clerk-heat",
            replies: [
              { ja: "はい、お願いします。", zh: "好，麻煩你。", clip: "reply-heat-yes", choose: () => chooseHeat(true) },
              { ja: "温めなくて大丈夫です。", zh: "不用加熱，謝謝。", clip: "reply-heat-no", choose: () => chooseHeat(false) }
            ]
          },
          bag: {
            title: "購物袋",
            ja: "レジ袋はおつけしますか？",
            zh: "需要購物袋嗎？",
            clip: "clerk-bag",
            replies: [
              { ja: "袋をお願いします。", zh: "麻煩給我一個袋子。", clip: "reply-bag-yes", choose: () => chooseBag(true) },
              { ja: "袋はいりません。", zh: "我不需要袋子。", clip: "reply-bag-no", choose: () => chooseBag(false) }
            ]
          },
          cash: {
            title: "付款方式",
            ja: `お会計は${total}円です。`,
            zh: `總共 ${total} 日圓。`,
            clip: `clerk-total-${total}`,
            replies: [
              { ja: "現金でお願いします。", zh: "我用現金付款。", clip: "reply-cash", choose: () => advance("pay") }
            ]
          },
          pay: {
            title: "現金付款",
            ja: "こちらのトレーにお願いします。",
            zh: "請把現金放在這個托盤上。",
            clip: "clerk-tray",
            replies: [{ label: `付 ${yen(total)}`, primary: true, choose: pay }]
          },
          receipt: {
            title: "收據",
            ja: "ありがとうございました。",
            zh: "謝謝惠顧。",
            clip: "clerk-thanks",
            replies: [{ label: "再練習一次", primary: true, choose: reset }]
          }
        };
        const scene = scenes[step];

        title.textContent = scene.title;
        question.textContent = scene.ja;
        translation.textContent = scene.zh;
        clerkClip = scene.clip;
        replay.textContent = "播放";
        replay.setAttribute("aria-label", "播放店員台詞");
        replay.disabled = false;
        replyNote.hidden = !scene.replies.some((reply) => reply.clip);
        receipt.hidden = !complete;
        if (complete) renderReceipt(total);

        options.replaceChildren(...scene.replies.map((reply) => {
          const button = document.createElement("button");
          button.type = "button";
          button.className = reply.primary ? "reply primary" : "reply";
          button.addEventListener("click", reply.choose, { once: true });
          if (!reply.clip) {
            button.textContent = reply.label;
            return button;
          }

          const japanese = document.createElement("span");
          japanese.className = "japanese";
          japanese.lang = "ja";
          japanese.textContent = reply.ja;
          const meaning = document.createElement("span");
          meaning.className = "translation";
          meaning.textContent = reply.zh;
          button.append(japanese, meaning);

          const listen = document.createElement("button");
          listen.type = "button";
          listen.className = "listen";
          listen.textContent = "試聽";
          listen.setAttribute("aria-label", `試聽 ${reply.ja}`);
          listen.addEventListener("click", () => playSpeech(reply.clip, listen));
          const row = document.createElement("div");
          row.className = "reply-row";
          row.append(button, listen);
          return row;
        }));
        updateHint();
        counterModel.update({ heated, bagged, total, paying: step === "pay", complete });
        panel.scrollTop = 0;
        title.focus({ preventScroll: true });
      }

      replay.addEventListener("click", () => playSpeech(clerkClip, replay));
      player.addEventListener("ended", () => { if (player.ended) stopSpeech(); });
      hint.addEventListener("click", () => {
        showChinese = !showChinese;
        updateHint();
      });
      return { reset, stopSpeech };
    }

    function startGame(THREE) {
      const stage = document.querySelector("#stage");
      const world = document.querySelector("#world");
      const checkoutPanel = document.querySelector("#checkout");
      const enterButton = document.querySelector("#enter");
      const leaveButton = document.querySelector("#leave");
      const curtain = document.querySelector("#transition");
      const doorChime = document.querySelector("#door-chime");
      doorChime.src = checkoutClips["door-chime"];
      const locationLabel = document.querySelector("#location");
      const controls = document.querySelector("#touch-controls");
      const streetFooter = document.querySelector("#street-footer");

      const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.75));
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.domElement.setAttribute("aria-hidden", "true");
      world.prepend(renderer.domElement);

      const street = new THREE.Scene();
      const counter = new THREE.Scene();
      const streetCamera = createCamera([9, 12, 17], [0, 0.45, 0.25]);
      const counterCamera = createCamera([4.4, 4.5, 12], [0, 1.2, -0.5]);
      const materials = new Map();
      const solidObjects = [];
      const shop = { doorX: 0.9, frontZ: -0.65 };
      const spawn = new THREE.Vector3(2.56, 0.11, 3.15);
      const doorLabelPosition = new THREE.Vector3(shop.doorX, 3.65, shop.frontZ + 0.14);
      const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");

      function createCamera(offset, target) {
        const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 100);
        camera.position.set(...target).add(new THREE.Vector3(...offset));
        camera.lookAt(...target);
        return camera;
      }

      function material(color, unlit = false) {
        const key = `${color}-${unlit}`;
        if (!materials.has(key)) {
          const Material = unlit ? THREE.MeshBasicMaterial : THREE.MeshStandardMaterial;
          materials.set(key, new Material({ color }));
        }
        return materials.get(key);
      }

      function box(parent, [width, height, depth], [x, y, z], color, unlit = false) {
        const mesh = new THREE.Mesh(new THREE.BoxGeometry(width, height, depth), material(color, unlit));
        mesh.position.set(x, y, z);
        parent.add(mesh);
        return mesh;
      }

      function cylinder(parent, radius, height, [x, y, z], color, sides = 12) {
        const mesh = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, height, sides), material(color));
        mesh.position.set(x, y, z);
        parent.add(mesh);
        return mesh;
      }

      function group(parent, x = 0, y = 0, z = 0) {
        const object = new THREE.Group();
        object.position.set(x, y, z);
        parent.add(object);
        return object;
      }

      function shadow(parent, x, z, radiusX, radiusZ, y = 0.115) {
        const mesh = new THREE.Mesh(
          new THREE.CircleGeometry(1, 24),
          new THREE.MeshBasicMaterial({ color: 0x16223c, transparent: true, opacity: 0.28, depthWrite: false })
        );
        mesh.position.set(x, y, z);
        mesh.rotation.x = -Math.PI / 2;
        mesh.scale.set(radiusX, radiusZ, 1);
        parent.add(mesh);
        return mesh;
      }

      function lights(scene, sky, ground, strength, keyColor) {
        scene.add(new THREE.HemisphereLight(sky, ground, strength));
        const key = new THREE.DirectionalLight(keyColor, 2.15);
        key.position.set(-4, 8, 6);
        scene.add(key);
      }

      function printedPanel(parent, [width, height], position, background, ink, label, size = 74) {
        const canvas = document.createElement("canvas");
        canvas.width = 768;
        canvas.height = Math.round(768 * height / width);
        const paint = canvas.getContext("2d");

      function buildReceiptPrinter(register) {
        box(register, [0.83, 0.19, 0.39], [0, 0.095, 0.37], 0x495563);
        box(register, [0.61, 0.012, 0.055], [0, 0.195, 0.46], 0x1b2630, true);
        const lamp = box(register, [0.067, 0.014, 0.038], [0.33, 0.198, 0.47], 0x9aba9b, true);

        const pattern = document.createElement("canvas");
        pattern.width = 128;
        pattern.height = 224;
        const ink = pattern.getContext("2d");
        ink.fillStyle = "#fffdf3";
        ink.fillRect(0, 0, 128, 224);
        ink.fillStyle = "#3d524b";
        ink.fillRect(28, 20, 72, 8);
        ink.fillRect(39, 36, 50, 4);
        for (const y of [62, 80, 98, 116, 153]) {
          ink.fillRect(15, y, 51, 5);
          ink.fillRect(87, y, 26, 5);
        }
        ink.fillRect(14, 137, 100, 2);
        for (let x = 32; x < 96; x += 6) ink.fillRect(x, 183, 3, 17);
        const texture = new THREE.CanvasTexture(pattern);
        texture.colorSpace = THREE.SRGBColorSpace;

        const segments = 18;
        const width = 0.53;
        const length = 0.87;
        const geometry = new THREE.PlaneGeometry(width, length, 1, segments);
        const positions = geometry.attributes.position.setUsage(THREE.DynamicDrawUsage);
        const uvs = geometry.attributes.uv.setUsage(THREE.DynamicDrawUsage);
        const paper = new THREE.Mesh(geometry, new THREE.MeshBasicMaterial({ map: texture }));
        paper.visible = false;
        paper.frustumCulled = false;
        register.add(paper);
        let job = null;

        function feed(progress) {
          for (let row = 0; row <= segments; row++) {
            const fraction = progress * row / segments;
            const distance = fraction * length;
            const height = 0.205 + 0.18 * (1 - Math.exp(-distance * 9)) - 0.28 * fraction ** 2;
            const z = 0.46 + distance;
            positions.setXYZ(row * 2, -width / 2, height, z);
            positions.setXYZ(row * 2 + 1, width / 2, height, z);
            // Keep the printed marks anchored to the paper as more of it emerges.
            uvs.setXY(row * 2, 0, 1 - progress + fraction);
            uvs.setXY(row * 2 + 1, 1, 1 - progress + fraction);
          }
          positions.needsUpdate = true;
          uvs.needsUpdate = true;
        }

        function reset() {
          job = null;
          paper.visible = false;
          lamp.material = material(0x9aba9b, true);
        }

        function print(done) {
          if (reducedMotion.matches) {
            done();
            return;
          }
          paper.visible = true;
          feed(0);
          lamp.material = material(0xffc978, true);
          job = { started: performance.now(), done };
        }

        function showFinished() {
          paper.visible = true;
          feed(1);
          lamp.material = material(0xb7efb5, true);
        }

        function animate(time) {
          if (!job) return;
          const progress = THREE.MathUtils.clamp((time - job.started) / 920, 0, 1);
          feed(progress);
          if (progress === 1) {
            const { done } = job;
            job = null;
            done();
          }
        }

        return { reset, print, showFinished, animate };
      }

        ["KeyW", "forward"], ["ArrowUp", "forward"],
        ["KeyA", "left"], ["ArrowLeft", "left"],
        ["KeyS", "back"], ["ArrowDown", "back"],
        ["KeyD", "right"], ["ArrowRight", "right"]
      ]);
      const raycaster = new THREE.Raycaster();
      const pointer = new THREE.Vector2();
      const projectedLabel = new THREE.Vector3();
      const streetCameraHome = streetCamera.position.clone();
      const doorApproach = new THREE.Vector3(shop.doorX, 0.65, shop.frontZ - 0.25);
      let openingStarted = null;
      let currentScene = "street";
      let switching = false;
      let stride = 0;
      let previousFrame = performance.now();

      function layout() {
        const width = world.clientWidth;
        const height = world.clientHeight;
        if (!width || !height) return;
        const aspect = width / height;
        renderer.setSize(width, height, false);
        for (const [camera, minimumWidth, minimumHeight] of [
          [streetCamera, 23.7, 12.8],
          [counterCamera, 13.7, 9.05]
        ]) {
          const halfHeight = Math.max(minimumHeight, minimumWidth / aspect) / 2;
          camera.left = -halfHeight * aspect;
          camera.right = halfHeight * aspect;
          camera.top = halfHeight;
          camera.bottom = -halfHeight;
          camera.updateProjectionMatrix();
          camera.updateMatrixWorld();
        }
        projectedLabel.copy(doorLabelPosition).project(streetCamera);
        enterButton.style.left = `${(projectedLabel.x + 1) * 50}%`;
        enterButton.style.top = `${(1 - projectedLabel.y) * 50}%`;
      }

      function clearInput() {
        keys.clear();
        touchKeys.clear();
        for (const button of controls.querySelectorAll("button")) button.classList.remove("is-held");
      }

      function setDoorApproach(progress) {
        door.setOpening(1 - (1 - progress) ** 3);
        const ease = progress * progress * (3 - 2 * progress);
        streetCamera.position.copy(streetCameraHome).addScaledVector(doorApproach, ease);
        streetCamera.zoom = 1 + 0.16 * ease;
        streetCamera.updateProjectionMatrix();
      }

      function changeScene(nextScene) {
        if (switching || nextScene === currentScene) return;
        switching = true;
        clearInput();
        const entering = nextScene === "counter";
        const fade = reducedMotion.matches ? 0 : 170;
        const approach = entering && fade ? 300 : 0;
        if (entering) {
          enterButton.hidden = true;
          if (approach) openingStarted = performance.now();
          doorChime.currentTime = 0;
          doorChime.play().catch(() => {});
        } else {
          checkout.stopSpeech();
          counterModel.resetPrinter();
        }

        if (approach) {
          window.setTimeout(() => curtain.classList.add("active"), approach);
        } else if (fade) {
          curtain.classList.add("active");
        }

        window.setTimeout(() => {
          openingStarted = null;
          currentScene = nextScene;
          const isStreet = currentScene === "street";
          stage.dataset.scene = currentScene;
          stage.setAttribute("aria-label", isStreet ? "3D 街道" : "3D 超商結帳櫃檯");
          locationLabel.textContent = isStreet ? "街道" : "結帳櫃檯";
          enterButton.hidden = !isStreet;
          leaveButton.hidden = isStreet;
          checkoutPanel.hidden = isStreet;
          streetFooter.hidden = !isStreet;
          if (isStreet) {
            setDoorApproach(0);
            player.root.position.copy(spawn);
            player.root.rotation.y = 0.36;
            player.body.position.y = 0;
            player.leftFoot.rotation.x = 0;
            player.rightFoot.rotation.x = 0;
            stride = 0;
            enterButton.focus({ preventScroll: true });
          } else {
            doorChime.pause();
            checkout.reset();
          }
          layout();
          renderer.domElement.style.cursor = "";
          curtain.classList.remove("active");
          window.setTimeout(() => { switching = false; }, fade);
        }, entering ? Math.max(450, approach + fade) : fade);
      }

      function isBlocked(x, z) {
        const radius = 0.22;
        return solidObjects.some(({ minX, maxX, minZ, maxZ }) =>
          x + radius > minX && x - radius < maxX && z + radius > minZ && z - radius < maxZ
        );
      }

      function updatePlayer(delta) {
        const directions = new Set(touchKeys.values());
        for (const code of keys) directions.add(keyDirections.get(code));
        move.set(0, 0, 0);
        if (directions.has("forward")) move.add(forward);
        if (directions.has("back")) move.sub(forward);
        if (directions.has("right")) move.add(right);
        if (directions.has("left")) move.sub(right);

        const position = player.root.position;
        let walking = false;
        if (move.lengthSq() > 0 && !switching) {
          move.normalize();
          const distance = 3.45 * delta;
          const x = THREE.MathUtils.clamp(position.x + move.x * distance, -9.24, 9.24);
          const z = THREE.MathUtils.clamp(position.z + move.z * distance, -5.57, 5.56);
          const startX = position.x;
          const startZ = position.z;
          if (!isBlocked(x, position.z)) position.x = x;
          if (!isBlocked(position.x, z)) position.z = z;
          walking = position.x !== startX || position.z !== startZ;
          player.root.rotation.y = Math.atan2(move.x, move.z);

          if (Math.abs(position.x - shop.doorX) < 0.91 && position.z < 0.03 && position.z > shop.frontZ) {
            changeScene("counter");
          }
        }

        playerShadow.position.x = position.x;
        playerShadow.position.z = position.z;
        if (walking && !reducedMotion.matches) {
          stride += delta * 16;
          player.leftFoot.rotation.x = Math.sin(stride) * 0.51;
          player.rightFoot.rotation.x = -player.leftFoot.rotation.x;
          player.body.position.y = Math.abs(Math.sin(stride)) * 0.047;
        } else {
          player.leftFoot.rotation.x = 0;
          player.rightFoot.rotation.x = 0;
          player.body.position.y = 0;
        }
      }

      function pointsAtDoor(event) {
        const rect = renderer.domElement.getBoundingClientRect();
        pointer.x = (event.clientX - rect.left) / rect.width * 2 - 1;
        pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
        raycaster.setFromCamera(pointer, streetCamera);
        return raycaster.intersectObject(door.root, true).length > 0;
      }

      window.addEventListener("keydown", (event) => {
        if (event.code === "Escape" && currentScene === "counter") changeScene("street");
        if (currentScene !== "street" || switching || !keyDirections.has(event.code)) return;
        if (event.metaKey || event.ctrlKey || event.altKey) return;
        event.preventDefault();
        if (!event.repeat) keys.add(event.code);
      });
      window.addEventListener("keyup", (event) => keys.delete(event.code));
      window.addEventListener("blur", clearInput);
      document.addEventListener("visibilitychange", () => { if (document.hidden) clearInput(); });
      renderer.domElement.addEventListener("pointermove", (event) => {
        renderer.domElement.style.cursor = currentScene === "street" && !switching && pointsAtDoor(event) ? "pointer" : "";
      });
      renderer.domElement.addEventListener("click", (event) => {
        if (currentScene === "street" && !switching && pointsAtDoor(event)) changeScene("counter");
      });
      enterButton.addEventListener("click", () => changeScene("counter"));
      leaveButton.addEventListener("click", () => changeScene("street"));

      for (const button of controls.querySelectorAll("button")) {
        button.addEventListener("pointerdown", (event) => {
          if (switching || event.button !== 0) return;
          button.setPointerCapture(event.pointerId);
          touchKeys.set(event.pointerId, button.dataset.direction);
          button.classList.add("is-held");
        });
        for (const eventName of ["pointerup", "pointercancel", "lostpointercapture"]) {
          button.addEventListener(eventName, (event) => {
            touchKeys.delete(event.pointerId);
            if (![...touchKeys.values()].includes(button.dataset.direction)) button.classList.remove("is-held");
          });
        }
      }

      function draw(time) {
        const delta = Math.min((time - previousFrame) / 1000, 0.045);
        previousFrame = time;
        if (currentScene === "street") {
          updatePlayer(delta);
          if (openingStarted !== null) {
            setDoorApproach(THREE.MathUtils.clamp((time - openingStarted) / 300, 0, 1));
          }
          renderer.render(street, streetCamera);
        } else {
          counterModel.animate(time);
          renderer.render(counter, counterCamera);
        }
      }

      const resizeObserver = new ResizeObserver(layout);
      resizeObserver.observe(world);
      layout();
      draw(performance.now());
      renderer.setAnimationLoop(draw);
      enterButton.hidden = false;
      controls.hidden = false;
      document.querySelector("#message").hidden = true;
    }
  </script>
